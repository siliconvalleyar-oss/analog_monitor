  provider: ^6.1.2
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  fake_async: ^1.3.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true